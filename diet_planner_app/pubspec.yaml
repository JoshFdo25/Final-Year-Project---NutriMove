name: diet_planner_app
description: "AI-Powered Diet Planner with Wearable Integration"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.7
  google_sign_in: ^6.2.2

  # State Management
  provider: ^6.1.2

  # Local Storage
  shared_preferences: ^2.3.4

  # Sensors
  sensors_plus: ^6.1.1

  # TFLite
  tflite_flutter: ^0.11.0

  # Charts
  fl_chart: ^0.70.2

  # Google Fonts
  google_fonts: ^6.2.1
  permission_handler: ^12.0.1
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/data/
    - assets/icon/
